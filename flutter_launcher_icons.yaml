# Launcher icons. Regenerate with:  dart run flutter_launcher_icons
# Source art: tool/illustrations/render.py → assets/branding/.
# Colors mirror lib/core/constants/app_colors.dart (YAML can't import Dart).

flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"

  android: "ic_launcher"
  min_sdk_android: 24
  # Android 8+ adaptive icon: capsule foreground on AppColors.sage.
  adaptive_icon_background: "#687163"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  # Android 13+ themed (monochrome) icon.
  adaptive_icon_monochrome: "assets/branding/app_icon_foreground.png"

  ios: true
  remove_alpha_ios: true
  background_color_ios: "#687163"
